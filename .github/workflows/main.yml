name: CI

# SeiunEngine lime fork CI: 每次 push 都构建各平台 ndll (Windows/Linux/macOS/Android/iOS 均走 SDL3),
# 供下游引擎构建使用并验证 fork 源码可编译。
#
# 重要前提: 本仓库的 project/lib 原生库 (openal/pixman/sdl 等) 必须"展平"提交
# (移除 submodule gitlink, 把含修复的源码直接作为普通文件入库)。
# 检查方式: git ls-files -s project/lib 不应出现 160000 条目。
# 若保留 gitlink, CI 的 submodules: true 会拉取官方 submodule 而丢失 JNI/NEON 修复。
#
# Windows 产物额外跑 vulkan/tests/check_exports.ps1: Vulkan 渲染器的每个 primitive 都
# 由 Haxe 侧按名字加载, 缺一个只会在运行时才暴露成一次空调用, 所以在这里让构建失败。

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ndll:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
            libmbedtls-dev libpng-dev libturbojpeg-dev libvorbis-dev \
            libpulse-dev libdbus-1-dev libudev-dev libibus-1.0-dev libwayland-dev

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          # run.n 为 -nocffi 编译 (不含 lime.ndll 引用), 任何 neko 版本均可运行。
          # 固定 2.3.0 与本机工具链保持一致。
          haxe-version: 4.2.5
          neko-version: 2.3.0

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib dev lime $GITHUB_WORKSPACE

      - name: Verify Lime tools
        run: haxelib run lime --version

      - name: Rebuild Lime Linux ndll (SDL3)
        run: haxelib run lime rebuild linux -64 -release -nocolor -verbose -nocffi -Dlime-sdl3 -DLIME_VULKAN

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Linux64-NDLL
          path: ndll/Linux64/
          if-no-files-found: error
          retention-days: 14

  windows-ndll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          # run.n 为 -nocffi 编译 (不含 lime.ndll 引用), 任何 neko 版本均可运行。
          # 固定 2.3.0 与本机工具链保持一致。
          haxe-version: 4.2.5
          neko-version: 2.3.0

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib dev lime $Env:GITHUB_WORKSPACE

      - name: Verify Lime tools
        run: haxelib run lime --version

      # LIME_VULKAN 在 project/Build.xml 里对 Windows 默认开启 (见 55d4ac4), 这里再显式
      # 传一次: 以后谁把默认值改动/换成分支判断, CI 也不会静默产出一个不含渲染器的 ndll。
      - name: Rebuild Lime Windows ndll (SDL3, with the Vulkan renderer)
        run: haxelib run lime rebuild windows -64 -release -nocolor -verbose -nocffi -Dlime-sdl3 -DLIME_VULKAN

      - name: Verify the Vulkan renderer is inside Lime.ndll
        shell: pwsh
        run: ./vulkan/tests/check_exports.ps1 -Ndll ndll/Windows64/lime.ndll

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows64-NDLL
          path: ndll/Windows64/
          if-no-files-found: error
          retention-days: 14

  macos-ndll:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          # run.n 为 -nocffi 编译 (不含 lime.ndll 引用), 任何 neko 版本均可运行。
          # 固定 2.3.0 与本机工具链保持一致。
          haxe-version: 4.2.5
          neko-version: 2.3.0

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib dev lime $GITHUB_WORKSPACE

      - name: Verify Lime tools
        run: haxelib run lime --version

      - name: Rebuild Lime macOS ndll (SDL3)
        run: haxelib run lime rebuild mac -64 -release -nocolor -verbose -nocffi -Dlime-sdl3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mac64-NDLL
          path: ndll/Mac64/
          if-no-files-found: error
          retention-days: 14

  android-ndll:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 11

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          # run.n 为 -nocffi 编译 (不含 lime.ndll 引用), 任何 neko 版本均可运行。
          # 固定 2.3.0 与本机工具链保持一致。
          haxe-version: 4.2.5
          neko-version: 2.3.0

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib dev lime $GITHUB_WORKSPACE

      - name: Verify Lime tools
        run: haxelib run lime --version

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config

      - name: Rebuild Lime Android ndll (SDL3)
        run: haxelib run lime rebuild android -release -nocolor -verbose -nocffi -Dlime-sdl3 -DLIME_VULKAN

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-NDLL
          path: ndll/Android/
          if-no-files-found: error
          retention-days: 14

  # iOS 与 macOS 并行: 重建只从本仓库源码出发, 不需要 macOS 的产物。以前这里有
  # needs: macos-ndll + 下载 Mac64 ndll, 是因为旧版 run.n 用 cffi 编译、运行 lime
  # 命令时要先加载 ndll/Mac64/lime.ndll; 6a17784 把 run.n 改成 -nocffi 之后这条
  # 依赖就消失了 (见上面 setup-haxe 一步的注释)。
  ios-ndll:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          # run.n 为 -nocffi 编译 (不含 lime.ndll 引用), 任何 neko 版本均可运行。
          # 固定 2.3.0 与本机工具链保持一致。
          haxe-version: 4.2.5
          neko-version: 2.3.0

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib dev lime $GITHUB_WORKSPACE

      - name: Verify Lime tools
        run: haxelib run lime --version

      # iOS/tvOS 自 d24dafd (apple SDL3) 起在 project/Build.xml 里默认走 SDL3 后端,
      # 这里仍显式传一次 -Dlime-sdl3: 和 Windows/Linux/Android 三个 job 保持一致,
      # 以后谁把默认值改回去, CI 也不会静默产出一个 SDL2 版 ndll。
      - name: Rebuild Lime iOS ndll (SDL3)
        run: haxelib run lime rebuild ios -arm64 -release -nocolor -verbose -nocffi -Dlime-sdl3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-NDLL
          path: ndll/iPhone/
          if-no-files-found: error
          retention-days: 14
