name: CI

# SeiunEngine lime fork CI: 构建各平台 ndll (桌面/Android 为 SDL3, iOS 为 SDL2),
# 供下游引擎构建使用并验证 fork 源码可编译。
#
# 重要前提: 本仓库的 project/lib 原生库 (openal/pixman/sdl 等) 必须"展平"提交
# (移除 submodule gitlink, 把含修复的源码直接作为普通文件入库)。
# 检查方式: git ls-files -s project/lib 不应出现 160000 条目。
# 若保留 gitlink, CI 的 submodules: true 会拉取官方 submodule 而丢失 JNI/NEON 修复。

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ndll:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
            libmbedtls-dev libpng-dev libturbojpeg-dev libvorbis-dev

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime $GITHUB_WORKSPACE
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime Linux ndll (SDL3)
        run: lime rebuild linux -64 -release -nocolor -verbose -nocffi -Dlime-sdl3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Linux64-NDLL
          path: ndll/Linux64/
          if-no-files-found: error
          retention-days: 14

  windows-ndll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime $Env:GITHUB_WORKSPACE
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime Windows ndll (SDL3)
        run: lime rebuild windows -64 -release -nocolor -verbose -nocffi -Dlime-sdl3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows64-NDLL
          path: ndll/Windows64/
          if-no-files-found: error
          retention-days: 14

  macos-ndll:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime $GITHUB_WORKSPACE
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Rebuild Lime macOS ndll (SDL3)
        run: lime rebuild mac -64 -release -nocolor -verbose -nocffi -Dlime-sdl3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mac64-NDLL
          path: ndll/Mac64/
          if-no-files-found: error
          retention-days: 14

  android-ndll:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 11

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime $GITHUB_WORKSPACE
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - name: Configure Android
        run: |
          lime config ANDROID_SDK $ANDROID_HOME
          lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          lime config JAVA_HOME $JAVA_HOME
          lime config ANDROID_SETUP true
          lime config

      - name: Rebuild Lime Android ndll (SDL3)
        run: lime rebuild android -release -nocolor -verbose -nocffi -Dlime-sdl3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-NDLL
          path: ndll/Android/
          if-no-files-found: error
          retention-days: 14

  ios-ndll:
    needs: macos-ndll
    runs-on: macos-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Install Haxe deps
        run: |
          haxelib install hxcpp --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Rebuild Lime tools
        run: |
          haxelib dev lime $GITHUB_WORKSPACE
          haxelib run lime rebuild tools -nocolor -verbose -nocffi
          haxelib run lime setup -alias -y -nocffi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mac64-NDLL
          path: ndll/Mac64/

      # iOS 引擎不使用 SDL3, 重建 SDL2 版 ndll
      - name: Rebuild Lime iOS ndll
        run: lime rebuild ios -arm64 -release -nocolor -verbose -nocffi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-NDLL
          path: ndll/iPhone/
          if-no-files-found: error
          retention-days: 14
